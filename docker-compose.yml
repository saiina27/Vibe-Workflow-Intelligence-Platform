services:
  postgres:
    image: postgres:17
    container_name: vibe_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe123
      POSTGRES_DB: vibe_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: