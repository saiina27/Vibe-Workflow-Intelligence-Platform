name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: Vibe
      APP_VERSION: ci
      DEBUG: "false"
      HOST: 127.0.0.1
      PORT: "8000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibe_test
      SECRET_KEY: ci-only-not-a-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      GEMINI_API_KEY: ci-dummy
      GEMINI_MODEL: gemini-3.5-flash
      GROQ_API_KEY: ci-dummy
      GROQ_MODEL: openai/gpt-oss-20b
      PRIMARY_PROVIDER: gemini
      FALLBACK_PROVIDER: groq
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create a throwaway encryption key
        run: |
          echo "OAUTH_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Migrations on an empty database (informational)
        continue-on-error: true
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
